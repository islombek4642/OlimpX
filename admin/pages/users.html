<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foydalanuvchilar - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) document.documentElement.setAttribute('data-theme', t.replace(/"/g, ''));
      } catch (e) {}
    })();
  </script>
</head>
<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <header class="admin-header" id="adminHeader"></header>

    <div class="admin-content">
      <div class="admin-container">
        <div class="admin-header-row mb-8">
          <div>
            <h1 class="admin-title">Foydalanuvchilar</h1>
            <p class="admin-subtitle">Tizimda ro'yxatdan o'tgan barcha ishtirokchilar</p>
          </div>
          <div class="admin-actions">
            <div style="position: relative;">
              <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5;">🔍</span>
              <input type="text" id="userSearch" placeholder="Ism yoki email bo'yicha qidiruv..." class="form-input" style="padding-left: 38px; width: 300px;">
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Foydalanuvchi</th>
                  <th>Email</th>
                  <th>Olimpiadalar</th>
                  <th>Oxirgi kirish</th>
                  <th>Sana</th>
                  <th>Amallar</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <!-- JS Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/admin-users.js"></script>
</body>
</html>
