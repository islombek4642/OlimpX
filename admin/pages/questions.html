<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savollar Bazasi - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/admin/styles/admin.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) document.documentElement.setAttribute('data-theme', t.replace(/"/g, ''));
      } catch (e) { }
    })();
  </script>
</head>

<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <header class="admin-header" id="adminHeader"></header>

    <div class="admin-content">
      <div class="admin-container">
        <div class="admin-header-row mb-8">
          <div>
            <h1 class="admin-title">Savollar Bazasi</h1>
            <p class="admin-subtitle">Olimpiada savollarini boshqarish va tahrirlash</p>
          </div>
          <button class="btn btn--primary" id="addQuestionBtn">
            <span>➕ Yangi savol</span>
          </button>
        </div>

        <!-- Filter & Search Row -->
        <div class="admin-card mb-8">
          <div class="admin-search-row mb-6">
            <div style="position: relative; width: 100%;">
              <span
                style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5;">🔍</span>
              <input type="text" id="questionSearch" placeholder="Savol bo'yicha qidiruv..." class="form-input"
                style="padding-left: 42px; width: 100%;">
            </div>
          </div>

          <div class="admin-filter-row">
            <label style="font-weight: 600; font-size: 14px; white-space: nowrap;">Olimpiadani tanlang:</label>
            <select id="olympiadFilter" class="form-input" style="width: 300px;">
              <option value="all">Barchasi</option>
              <!-- Populated by JS -->
            </select>
          </div>
        </div>



        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width: 50px;">ID</th>
                  <th>Savol matni</th>
                  <th>Olimpiada</th>
                  <th>To'g'ri javob</th>
                  <th>Amallar</th>
                </tr>
              </thead>
              <tbody id="questionsTableBody">
                <!-- JS Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Question Modal -->
  <div class="modal-overlay" id="questionModal">
    <div class="modal-content" style="max-width: 600px;">
      <h2 id="modalTitle" class="mb-6">Yangi savol qo'shish</h2>
      <form id="questionForm">
        <div class="form-group mb-4">
          <label class="form-label">Savol matni</label>
          <textarea id="qText" class="form-input" required minlength="5" maxlength="2000"
            placeholder="Savolni kiriting..." style="min-height: 80px; resize: vertical;"></textarea>
        </div>

        <div class="form-group mb-4">
          <label class="form-label">Tegishli Olimpiada</label>
          <select id="qOlympiad" class="form-input" required>
            <!-- Populated by JS -->
          </select>
        </div>

        <div class="options-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Variant A</label>
            <input type="text" id="opt0" class="form-input" required minlength="1" maxlength="500">
          </div>
          <div class="form-group">
            <label class="form-label">Variant B</label>
            <input type="text" id="opt1" class="form-input" required minlength="1" maxlength="500">
          </div>
          <div class="form-group">
            <label class="form-label">Variant C</label>
            <input type="text" id="opt2" class="form-input" required minlength="1" maxlength="500">
          </div>
          <div class="form-group">
            <label class="form-label">Variant D</label>
            <input type="text" id="opt3" class="form-input" required minlength="1" maxlength="500">
          </div>
        </div>


        <div class="form-row mt-4">
          <div class="form-group">
            <label class="form-label">To'g'ri javob</label>
            <select id="qCorrect" class="form-input" required>
              <option value="0">Variant A</option>
              <option value="1">Variant B</option>
              <option value="2">Variant C</option>
              <option value="3">Variant D</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Vaqt (soniya)</label>
            <select id="qDuration" class="form-input" required>
              <option value="15">15 soniya</option>
              <option value="30" selected>30 soniya</option>
              <option value="45">45 soniya</option>
              <option value="60">1 daqiqa</option>
              <option value="120">2 daqiqa</option>
              <option value="180">3 daqiqa</option>
              <option value="300">5 daqiqa</option>
            </select>
          </div>
        </div>

        <div class="modal-footer mt-8">
          <button type="button" class="btn btn--secondary" id="closeModal">Bekor qilish</button>
          <button type="submit" class="btn btn--primary">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="/admin/scripts/admin-questions.js"></script>
</body>

</html>
