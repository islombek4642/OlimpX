<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sozlamalar - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) document.documentElement.setAttribute('data-theme', t.replace(/"/g, ''));
      } catch (e) { }
    })();
  </script>
</head>

<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <header class="admin-header" id="adminHeader"></header>

    <div class="admin-content">
      <div class="admin-container" style="max-width: 800px;">
        <div class="admin-welcome mb-8">
          <h1 class="admin-title">Tizim Sozlamalari</h1>
          <p class="admin-subtitle">Platforma parametrlarini boshqarish va xavfsizlik</p>
        </div>

        <!-- Settings Sections -->
        <div class="admin-settings-grid">

          <!-- General Settings -->
          <div class="admin-card mb-6 animate-fadeIn" style="animation-delay: 0.1s;">
            <div class="admin-card__header">
              <h3 class="admin-card__title">🌐 Umumiy sozlamalar</h3>
            </div>
            <div class="settings-form">
              <div class="form-group">
                <label class="form-label">Platforma nomi</label>
                <input type="text" class="form-input" value="OlimpX Ta'lim Platformasi">
              </div>
            </div>

          </div>

          <!-- Profile Settings -->
          <div class="admin-card mb-6 animate-fadeIn" style="animation-delay: 0.2s;">
            <div class="admin-card__header">
              <h3 class="admin-card__title">👤 Admin profili</h3>
            </div>
            <div class="settings-form">
              <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                <div
                  style="width: 80px; height: 80px; border-radius: 20px; background: var(--color-primary-600); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800;">
                  A</div>
                <div>
                  <button class="btn btn--outline btn--sm">Rasmni o'zgartirish</button>
                  <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 8px;">Tavsiya etilgan o'lcham:
                    400x400px (JPG, PNG)</p>
                </div>
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Ism va familiya</label>
                <input type="text" class="form-input" value="Administrator" placeholder="Ismingizni kiriting">
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Email manzili</label>
                <input type="email" class="form-input" value="admin@olimpx.uz" placeholder="Emailingizni kiriting">
              </div>
            </div>
          </div>

          <!-- Security Settings -->
          <div class="admin-card mb-6 animate-fadeIn" style="animation-delay: 0.3s;">
            <div class="admin-card__header">
              <h3 class="admin-card__title">🔒 Xavfsizlik</h3>
            </div>
            <div class="settings-form">
              <div class="form-group mb-4">
                <label class="form-label">Joriy parol</label>
                <div class="password-input-wrapper">
                  <input type="password" class="form-input" autocomplete="current-password" id="currentPassword" placeholder="Joriy parolni kiriting">
                  <button type="button" class="password-toggle" data-target="currentPassword">
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>
              <div class="form-row mb-4">
                <div class="form-group">
                  <label class="form-label">Yangi parol</label>
                  <div class="password-input-wrapper">
                    <input type="password" class="form-input" autocomplete="new-password" id="newPassword" placeholder="Yangi parolni kiriting">
                    <button type="button" class="password-toggle" data-target="newPassword">
                      <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                      <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Parolni tasdiqlash</label>
                  <div class="password-input-wrapper">
                    <input type="password" class="form-input" autocomplete="new-password" id="confirmPassword" placeholder="Parolni tasdiqlang">
                    <button type="button" class="password-toggle" data-target="confirmPassword">
                      <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                      <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>
              </div>

              <button class="btn btn--primary" id="saveSettingsBtn">O'zgarishlarni saqlash</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/admin-settings.js"></script>
</body>

</html>
