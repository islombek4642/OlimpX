<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olimpiadalar - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) document.documentElement.setAttribute('data-theme', t.replace(/"/g, ''));
      } catch (e) { }
    })();
  </script>
</head>

<body class="admin-body">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <header class="admin-header" id="adminHeader"></header>

    <div class="admin-content">
      <div class="admin-container">
        <div class="admin-header-row mb-8">
          <div>
            <h1 class="admin-title">Olimpiadalar</h1>
            <p class="admin-subtitle">Tizimdagi barcha faol va arxivlangan olimpiadalar</p>
          </div>
          <div class="admin-actions" style="display: flex; gap: 12px;">
            <button class="btn btn--secondary" id="bulkUploadBtn">
              <span>📤 Word yuklash</span>
            </button>
            <button class="btn btn--primary" id="addOlympiadBtn">
              <span>➕ Yangi qo'shish</span>
            </button>
          </div>

        </div>

        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nomi</th>
                  <th>Savollar</th>
                  <th>Vaqt (soniya)</th>
                  <th>Holati</th>
                  <th>Amallar</th>
                </tr>
              </thead>
              <tbody id="olympiadsTableBody">
                <!-- JS Populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal for Add/Edit (Simplified for now) -->
  <div class="modal-overlay" id="olympiadModal">
    <div class="modal-content" style="max-width: 500px;">
      <h2 id="modalTitle" class="mb-6">Yangi Olimpiada</h2>
      <form id="olympiadForm">
        <div class="form-group mb-4">
          <label class="form-label" for="olymTitle">Olimpiada nomi</label>
          <input type="text" id="olymTitle" class="form-input" required placeholder="Masalan: Matematika">
        </div>
        <div class="form-row mb-4">
          <div class="form-group">
            <label class="form-label" for="olymDuration">Har bir savol vaqti (default)</label>
            <select id="olymDuration" class="form-input">
              <option value="15">15 soniya</option>
              <option value="30" selected>30 soniya</option>
              <option value="45">45 soniya</option>
              <option value="60">1 daqiqa</option>
              <option value="120">2 daqiqa</option>
              <option value="180">3 daqiqa</option>
              <option value="300">5 daqiqa</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="olymCategory">Kategoriya</label>
            <input type="text" id="olymCategory" class="form-input" placeholder="Masalan: Fan" value="Boshqa">
          </div>
        </div>

        <div class="modal-footer mt-8">
          <button type="button" class="btn btn--secondary" id="closeModal">Bekor qilish</button>
          <button type="submit" class="btn btn--primary">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bulk Upload Modal -->
  <div class="modal-overlay" id="bulkUploadModal">
    <div class="modal-content" style="max-width: 500px;">
      <h2 class="mb-6">Word orqali yangi olimpiada</h2>
      <div class="form-group mb-4">
        <label class="form-label" for="bulkOlymTitle">Olimpiada nomi</label>
        <input type="text" id="bulkOlymTitle" class="form-input" required minlength="3" maxlength="100" placeholder="Masalan: Fizika yangi">
      </div>

      <div class="form-group mb-4">
        <label class="form-label" for="bulkOlymDescription">Olimpiada haqida</label>
        <textarea id="bulkOlymDescription" class="form-input" rows="3" placeholder="Olimpiada haqida qisqacha ma'lumot..."></textarea>
      </div>
      
      <div class="form-group mb-4">
        <label class="form-label" for="bulkQuestionDuration">Har bir savol vaqti (default)</label>
        <select id="bulkQuestionDuration" class="form-input">
          <option value="15">15 soniya</option>
          <option value="30" selected>30 soniya</option>
          <option value="45">45 soniya</option>
          <option value="60">1 daqiqa</option>
          <option value="120">2 daqiqa</option>
          <option value="180">3 daqiqa</option>
          <option value="300">5 daqiqa</option>
        </select>
      </div>

      <div class="form-group mb-6">
        <label class="form-label" for="bulkOlymFile">Word faylni tanlang (.docx)</label>
        <input type="file" id="bulkOlymFile" class="form-input" accept=".docx" required style="padding-top: 12px;">

        <p class="mt-2" style="font-size: 11px; color: var(--text-tertiary);">
          Format: ?Savol, +To'g'ri javob, =Noto'g'ri javob
        </p>
      </div>

      <div id="bulkStatus" class="mb-4" style="display: none; padding: 12px; border-radius: 8px; font-size: 14px;"></div>

      <div class="modal-footer mt-4">
        <button type="button" class="btn btn--secondary" id="closeBulkModal">Bekor qilish</button>
        <button type="button" class="btn btn--primary" id="startBulkUpload" disabled>Yaratish va yuklash</button>
      </div>
    </div>
  </div>


  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/admin-olympiads.js"></script>


</body>

</html>
