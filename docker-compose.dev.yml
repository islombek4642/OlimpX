version: '3.8'

# Development Docker Compose
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: olimpx-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/olimpx?schema=public
      - JWT_SECRET=dev-secret-key-at-least-32-characters-long
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
      - CORS_ORIGIN=http://localhost:3000
      - PORT=3000
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - olimpx-network

  db:
    image: postgres:15-alpine
    container_name: olimpx-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=olimpx
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - olimpx-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: olimpx-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      - db
    networks:
      - olimpx-network

networks:
  olimpx-network:
    driver: bridge

volumes:
  postgres-dev-data:
