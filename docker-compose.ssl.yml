services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olimpx-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=https://${DOMAIN}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - PORT=3000
      - DOMAIN=${DOMAIN}
    depends_on:
      - db
      - redis
    networks:
      - olimpx-network
    volumes:
      - uploads:/app/backend/uploads

  db:
    image: postgres:15-alpine
    container_name: olimpx-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-olimpx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - olimpx-network

  nginx:
    image: nginx:alpine
    container_name: olimpx-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - olimpx-network

  redis:
    image: redis:7-alpine
    container_name: olimpx-redis
    restart: unless-stopped
    networks:
      - olimpx-network
    volumes:
      - redis-data:/data

networks:
  olimpx-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads:
