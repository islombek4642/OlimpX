<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olimpiadalar - OlimpX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) {
          var theme = t.replace(/"/g, '');
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .olympiads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-8);
      margin-top: var(--space-10);
    }
    .olympiad-card {
      background: var(--bg-elevated);
      border-radius: var(--radius-3xl);
      padding: var(--space-8);
      border: 1px solid var(--border-light);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .olympiad-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-xl);
      border-color: var(--color-primary-300);
    }
    .olympiad-card__icon {
      width: 64px; height: 64px;
      background: var(--color-primary-50);
      border-radius: var(--radius-2xl);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: var(--space-6);
    }
    .olympiad-card__badge {
      position: absolute; top: var(--space-6); right: var(--space-6);
      padding: 4px 12px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 700;
      background: var(--color-primary-100); color: var(--color-primary-700);
    }
    .olympiad-card__title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .olympiad-card__desc { color: var(--text-secondary); font-size: 14px; margin-bottom: var(--space-8); flex-grow: 1; line-height: 1.6; }
  </style>
</head>
<body>
  <nav class="navbar"></nav>

  <main class="dashboard">
    <div class="dashboard__container">
      <div class="dashboard__header">
        <h1 class="dashboard__title" style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Barcha olimpiadalar</h1>
        <p class="dashboard__subtitle" style="font-size: 18px; color: var(--text-secondary);">O'zingizga mos yo'nalishni tanlang va bilimingizni sinang</p>
      </div>

      <div class="olympiads-grid" id="olympiadsGrid">
        <!-- Will be populated by JS -->
        <div class="skeleton-loader" style="grid-column: 1/-1; text-align: center; padding: 100px;">
          <p>Olimpiadalar yuklanmoqda...</p>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Countdown Modal -->
  <div class="modal-overlay" id="countdownModal">
    <div class="modal-content modal-content--countdown">
      <div class="countdown-circle">
        <span id="countdownNumber">5</span>
        <svg class="countdown-svg" viewBox="0 0 140 140">
          <circle r="60" cx="70" cy="70"></circle>
        </svg>
      </div>
      <h2 class="modal-title mt-6">Tayyorlaning!</h2>
      <p class="modal-text">Olimpiada bir necha soniyadan so'ng boshlanadi...</p>
    </div>
  </div>

  <script type="module" src="../scripts/olympiads.js"></script>
</body>
</html>
