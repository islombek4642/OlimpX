<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natijalar tarixi - OlimpX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/pages.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) {
          var theme = t.replace(/"/g, '');
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <nav class="navbar"></nav>

  <main class="dashboard">
    <div class="dashboard__container">
      <div class="dashboard__header" style="margin-bottom: var(--space-10);">
        <h1 class="dashboard__title" style="font-size: 32px; font-weight: 800;">Natijalar tarixi</h1>
        <p class="dashboard__subtitle" style="font-size: 18px; color: var(--text-secondary);">Barcha topshirgan olimpiadalaringiz ro'yxati</p>
      </div>

      <div id="historyList">
        <!-- Will be populated by JS -->
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/history.js"></script>
</body>
</html>
