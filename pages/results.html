<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natija - OlimpX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/pages.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) {
          var theme = t.replace(/"/g, '');
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
  <!-- jsPDF Library for Certificate Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar"></nav>

  <div class="results-page">
    <div class="results-container">
      <div class="result-hero animate-fadeIn">
        <div class="score-circle" id="scoreCircle">
          <div class="score-value" id="finalScore">0<span>%</span></div>
        </div>
        <h1 class="result-title" id="resultStatus">Muvaffaqiyatli!</h1>
        <p class="result-subtitle" id="olympiadTitle">Matematika - Mantiqiy savollar</p>

        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-card__icon">📝</span>
            <span class="stat-card__value" id="totalQuestions">0</span>
            <span class="stat-card__label">Jami</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__icon">✅</span>
            <span class="stat-card__value" id="correctCount">0</span>
            <span class="stat-card__label">To'g'ri</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__icon">❌</span>
            <span class="stat-card__value" id="incorrectCount">0</span>
            <span class="stat-card__label">Noto'g'ri</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__icon">⏭️</span>
            <span class="stat-card__value" id="skippedCount">0</span>
            <span class="stat-card__label">O'tkazildi</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__icon">⏱️</span>
            <span class="stat-card__value" id="timeTaken">00:00</span>
            <span class="stat-card__label">Vaqt</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__icon">⚡</span>
            <span class="stat-card__value" id="averageTime">0s</span>
            <span class="stat-card__label">O'rtacha</span>
          </div>
        </div>


        <div class="flex justify-center gap-4">
          <a href="dashboard.html" class="btn btn--secondary" style="padding: 12px 30px; border-radius: 100px;">Bosh sahifa</a>
          <button id="downloadBtn" class="btn btn--primary" style="padding: 12px 30px; border-radius: 100px;">Sertifikatni yuklash</button>
        </div>
      </div>

      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: var(--space-6);">Batafsil tahlil</h2>
      <div id="reviewList">
        <!-- Will be populated by JS -->
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/results.js"></script>
</body>
</html>
