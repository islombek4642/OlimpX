<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parolni tiklash - OlimpX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('olimpx_theme');
        if (t) {
          var theme = t.replace(/"/g, '');
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-page__content">
      <div class="auth-card">
        <div class="auth-card__header">
          <div class="auth-card__logo">OX</div>
          <h1 class="auth-card__title">Parolni tiklash</h1>
          <p class="auth-card__subtitle">Email manzilingizni kiriting, parolni tiklash yo'riqnomasini yuboramiz</p>
        </div>

        <div class="auth-card__body" id="requestStep">
          <form id="forgotForm" novalidate>
            <div class="form-group">
              <input type="email" id="email" name="email" class="form-input" placeholder="Email manzilni kiriting" autocomplete="email" required>
              <label for="email" class="form-label">Email manzil</label>
            </div>
            <button type="submit" id="submitBtn" class="btn btn--primary btn--full btn--lg">
              <span class="btn__text">Yuborish</span>
            </button>
          </form>
        </div>

        <div class="auth-card__body" id="successStep" style="display: none;">
          <div class="text-center py-8">
            <div class="w-16 h-16 mx-auto mb-4 bg-success-100 rounded-full flex items-center justify-center">
              <svg class="w-8 h-8 text-success-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-primary mb-2">Yuborildi!</h3>
            <p class="text-secondary mb-6">Agar ushbu email ro'yxatdan o'tgan bo'lsa, yo'riqnoma yuborildi.</p>
            <a href="login.html" class="btn btn--secondary btn--full">Kirish sahifasiga qaytish</a>
          </div>
        </div>

        <div class="auth-card__footer">
          <p class="auth-card__link"><a href="login.html">← Kirish sahifasiga qaytish</a></p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="../scripts/forgot-password.js"></script>
</body>
</html>
