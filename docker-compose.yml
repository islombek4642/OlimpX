services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olimpx-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=https://${DOMAIN:-localhost}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - PORT=3000
      - DOMAIN=${DOMAIN}
      - VIRTUAL_HOST=${DOMAIN:-localhost},www.${DOMAIN:-localhost}
      - LETSENCRYPT_HOST=${DOMAIN:-localhost},www.${DOMAIN:-localhost}
      - VIRTUAL_PORT=3000
    depends_on:
      - db
    networks:
      - olimpx-network
      - proxy_network
    volumes:
      - uploads:/app/backend/uploads

  db:
    image: postgres:15-alpine
    container_name: olimpx-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-olimpx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - olimpx-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: olimpx-redis
    restart: unless-stopped
    networks:
      - olimpx-network
    volumes:
      - redis-data:/data

networks:
  olimpx-network:
    driver: bridge
  proxy_network:
    external: true

volumes:
  postgres-data:
  redis-data:
  uploads:
